name: Deploy production

on:
  workflow_run:
    workflows: ["CI Local-Gate Mirror"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rev:
    name: Resolve SHA
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - id: rev
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-oh-macos:
    name: Build oh (darwin-arm64)
    needs: rev
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rev.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
      - run: cargo build --release --bin oh
      - uses: actions/upload-artifact@v4
        with:
          name: oh-darwin-arm64
          path: target/release/oh

  deploy:
    name: Build and rsync to pararouter-hk
    needs: [rev, build-oh-macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rev.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      - name: Build openhub and oh (linux)
        run: cargo build --release --bin openhub --bin oh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build Admin UI
        working-directory: admin
        run: |
          npm ci
          npm run build

      - uses: actions/download-artifact@v4
        with:
          name: oh-darwin-arm64
          path: /tmp/oh-darwin-arm64

      - name: Stage CLI binaries into www
        run: |
          set -euo pipefail
          mkdir -p admin/dist/dist
          cp target/release/oh admin/dist/dist/oh-linux-x86_64
          cp /tmp/oh-darwin-arm64/oh admin/dist/dist/oh-darwin-arm64
          chmod 755 admin/dist/dist/oh-linux-x86_64 admin/dist/dist/oh-darwin-arm64

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync binary + UI and restart systemd
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az target/release/openhub "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/openhub.new"
          rsync -az --delete admin/dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/openhub-www.new/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          test -x /tmp/openhub.new
          test -f /tmp/openhub-www.new/index.html
          test -f /tmp/openhub-www.new/dist/oh-darwin-arm64
          sudo systemctl stop openhub
          install -d /home/xinference/src/openhub/target/release
          install -m 755 /tmp/openhub.new /home/xinference/src/openhub/target/release/openhub
          if [ -d /home/xinference/openhub-www ]; then
            rm -rf /home/xinference/openhub-www.prev
            mv /home/xinference/openhub-www /home/xinference/openhub-www.prev
          fi
          mv /tmp/openhub-www.new /home/xinference/openhub-www
          sudo systemctl start openhub
          sleep 2
          curl -fsS http://127.0.0.1:8080/health
          test -f /home/xinference/openhub-www/llms.txt
          REMOTE
