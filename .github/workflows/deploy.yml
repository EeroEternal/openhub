name: Deploy production

on:
  workflow_run:
    workflows: ["CI Local-Gate Mirror"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-ui:
    name: Rsync Admin UI to pararouter-hk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolve SHA
        id: rev
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build Admin UI
        working-directory: admin
        run: |
          npm install
          npm run build

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync Admin dist
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete admin/dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/openhub-www.new/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          test -f /tmp/openhub-www.new/index.html
          if [ -d /home/xinference/openhub-www ]; then
            rm -rf /home/xinference/openhub-www.prev
            mv /home/xinference/openhub-www /home/xinference/openhub-www.prev
          fi
          mv /tmp/openhub-www.new /home/xinference/openhub-www
          test -f /home/xinference/openhub-www/llms.txt
          REMOTE
