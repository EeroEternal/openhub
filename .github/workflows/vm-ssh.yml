name: Authorize VM SSH

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: SSH public key to append for DEPLOY_USER
        required: true
        type: string

concurrency:
  group: authorize-vm-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Install operator public key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Append public key to authorized_keys
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PUBKEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf '%s\n' "$PUBKEY" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'key=$(cat)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          grep -qxF "$key" ~/.ssh/authorized_keys || echo "$key" >> ~/.ssh/authorized_keys'
          echo "installed public key for ${DEPLOY_USER}@${DEPLOY_HOST}"
