[package]
name = "openhub"
version = "0.1.0"
edition = "2024"
authors = ["EeroEternal"]
description = "OpenHub hosted origin for openhub.run — GCP compute behind Cloudflare DNS"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gitcell = { git = "https://github.com/EeroEternal/gitcell.git" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
tempfile = "3.14"
