[package]
name = "openhub"
version = "0.1.0"
edition = "2024"
authors = ["EeroEternal"]
description = "OpenHub hosted origin for openhub.run — GCP compute behind Cloudflare DNS"
default-run = "openhub"

[[bin]]
name = "openhub"
path = "src/main.rs"

[[bin]]
name = "oh"
path = "src/bin/oh.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gitcell = { git = "https://github.com/EeroEternal/gitcell.git" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.12", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
tempfile = "3.14"
